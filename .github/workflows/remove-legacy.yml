name: Remove legacy portfolio files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r guyuewebsite .github/workflows/jekyll-gh-pages.yml .github/workflows/static.yml .github/workflows/remove-legacy.yml
          git commit -m "Remove legacy portfolio files"
          git push
